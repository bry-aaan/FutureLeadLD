name: Build VST3 (Windows)
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target FutureLeadLD_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\FutureLeadLD_artefacts\Release\VST3\FutureLead LD.vst3" dist\

      - uses: actions/upload-artifact@v4
        with:
          name: FutureLeadLD-VST3-Windows
          path: dist
